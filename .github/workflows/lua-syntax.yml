name: Lua Syntax Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name "*.lua" | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Lua files found"
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking ${file}"
            lua -e 'local f=assert(loadfile(arg[1])); if f then print("OK: " .. arg[1]) end' "${file}"
          done
