name: Lua Checks

on:
  push:
  pull_request:

jobs:
  lua-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        shell: bash
        run: luarocks install luacheck

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name "*.lua" | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Lua files found"
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking ${file}"
            LUA_FILE="${file}" lua -e 'local path = assert(os.getenv("LUA_FILE"), "missing LUA_FILE"); local f, err = loadfile(path); assert(f, err); print("OK: " .. path)'
          done

      - name: Run luacheck
        shell: bash
        run: luacheck .
